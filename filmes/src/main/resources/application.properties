spring.application.name=filmes

# ==============================================================================
# CONFIGURAÇÃO DO BANCO DE DADOS MYSQL
# ==============================================================================
# O parâmetro createDatabaseIfNotExist=true cria o banco 'db_filmes' automaticamente se ele não existir
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_filmes?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# ==============================================================================
# update: cria ou atualiza as tabelas automaticamente sem apagar os dados existentes
spring.jpa.hibernate.ddl-auto=update

# Exibe e formata as consultas SQL no console para facilitar o debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# ==============================================================================
# CONFIGURAÇÃO DO WEB SERVICE DE FILMES (TMDB - THE MOVIE DATABASE)
# ==============================================================================
tmdb.api.key=${TMDB_API_KEY:}
tmdb.api.base-url=${TMDB_API_BASE_URL:https://api.themoviedb.org/3}
tmdb.image.base-url=${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p/w500}

# ==============================================================================
# CONFIGURAÇÃO DO SERVIDOR
# ==============================================================================
server.port=${SERVER_PORT:8080}
